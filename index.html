<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Estudos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
    #sidebar {
      width: 220px; background: #1e1e2e; color: white;
      display: flex; flex-direction: column; padding: 20px 0;
    }
    #sidebar h2 { font-size: 14px; color: #888; padding: 0 16px 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .material {
      padding: 10px 16px; cursor: pointer; font-size: 14px; color: #ccc;
      border-left: 3px solid transparent; transition: all 0.2s;
    }
    .material:hover, .material.ativo { background: #2a2a3e; color: white; border-left-color: #7c6af7; }
    #conteudo { flex: 1; display: flex; flex-direction: column; }
    #area-material {
      padding: 24px; background: white; border-bottom: 1px solid #eee;
      display: none; max-height: 40vh; overflow-y: auto;
    }
    #area-material.visivel { display: block; }
    #area-material h2 { font-size: 18px; margin-bottom: 12px; color: #1e1e2e; }
    #area-material p { font-size: 14px; line-height: 1.7; color: #444; margin-bottom: 10px; }
    #chat-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #chat-header { padding: 16px 20px; background: white; border-bottom: 1px solid #eee; }
    #chat-header h2 { font-size: 15px; color: #1e1e2e; }
    #chat-header p { font-size: 12px; color: #888; }
    #mensagens { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { display: flex; gap: 10px; align-items: flex-start; max-width: 80%; }
    .msg.usuario { align-self: flex-end; flex-direction: row-reverse; }
    .msg .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; flex-shrink: 0;
    }
    .msg.bot .avatar { background: #e8e4ff; color: #5b4fcf; }
    .msg.usuario .avatar { background: #eee; color: #555; }
    .msg .balao { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
    .msg.bot .balao { background: #f0f0f0; color: #222; border-radius: 0 12px 12px 12px; }
    .msg.usuario .balao { background: #7c6af7; color: white; border-radius: 12px 0 12px 12px; }
    #input-area { padding: 14px 16px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; }
    #input-area input {
      flex: 1; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; outline: none;
    }
    #input-area button {
      background: #7c6af7; color: white; border: none;
      padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    #input-area button:hover { background: #5b4fcf; }
    .digitando { font-size: 13px; color: #888; padding: 0 20px; }
  </style>
</head>
<body>

<div id="sidebar">
  <h2>Materiais</h2>
  <div class="material" onclick="abrirMaterial('html')">Introdução ao HTML</div>
  <div class="material" onclick="abrirMaterial('css')">CSS Básico</div>
  <div class="material" onclick="abrirMaterial('js')">JavaScript</div>
  <div class="material" onclick="abrirMaterial('git')">Git & GitHub</div>
  <div class="material" onclick="abrirMaterial('logica')">Lógica de Programação</div>
</div>

<div id="conteudo">
  <div id="area-material"></div>
  <div id="chat-wrapper">
    <div id="chat-header">
      <h2>Assistente de Programação</h2>
      <p>Tire suas dúvidas sobre código</p>
    </div>
    <div id="mensagens">
      <div class="msg bot">
        <div class="avatar">IA</div>
        <div class="balao">Olá! Sou seu assistente de programação. Pode me perguntar qualquer coisa sobre HTML, CSS, JavaScript e mais!</div>
      </div>
    </div>
    <div id="input-area">
      <input type="text" id="inputMsg" placeholder="Digite sua pergunta..." onkeydown="if(event.key==='Enter') enviar()" />
      <button onclick="enviar()">Enviar</button>
    </div>
  </div>
</div>

<script>
const CHAVE = "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";

const materiais = {
  html: {
    titulo: "Introdução ao HTML",
    texto: "HTML é a linguagem base de toda página web. Ele define a estrutura do conteúdo usando tags. Por exemplo: h1 cria um título, p cria um parágrafo, e a cria um link. Todo arquivo HTML começa com DOCTYPE html e tem as tags html, head e body. O head contém informações sobre a página e o body contém o que aparece na tela."
  },
  css: {
    titulo: "CSS Básico",
    texto: "CSS é usado para estilizar páginas HTML. Com ele você controla cores, fontes, tamanhos e posicionamento. Um estilo básico: p { color: red; font-size: 16px; }. Você pode adicionar CSS dentro de uma tag style no HTML ou em um arquivo separado .css."
  },
  js: {
    titulo: "JavaScript",
    texto: "JavaScript é a linguagem que torna as páginas interativas. Com JS você pode reagir a cliques, mostrar mensagens, fazer requisições e muito mais. Exemplo: let nome = João; alert(Olá + nome)."
  },
  git: {
    titulo: "Git e GitHub",
    texto: "Git é um sistema de controle de versões. GitHub é a plataforma online que armazena seus repositórios. Os comandos principais são: git init, git add, git commit e git push. Com o GitHub Pages você publica seu site de graça!"
  },
  logica: {
    titulo: "Lógica de Programação",
    texto: "Lógica de programação é a base de tudo: sequência, condição e repetição. Em JavaScript: if (x maior que 0) é uma condição. O for é uma repetição. Variáveis guardam valores. Funções agrupam ações para reutilizar."
  }
};

function abrirMaterial(id) {
  const area = document.getElementById('area-material');
  const m = materiais[id];
  area.innerHTML = `<h2>${m.titulo}</h2><p>${m.texto}</p>`;
  area.classList.add('visivel');
  document.querySelectorAll('.material').forEach(el => el.classList.remove('ativo'));
  event.target.classList.add('ativo');
}

async function enviar() {
  const input = document.getElementById('inputMsg');
  const texto = input.value.trim();
  if (!texto) return;
  input.value = '';

  const msgs = document.getElementById('mensagens');
  msgs.innerHTML += `<div class="msg usuario"><div class="avatar">EU</div><div class="balao">${texto}</div></div>`;

  const digitando = document.createElement('p');
  digitando.className = 'digitando';
  digitando.innerText = 'Assistente digitando...';
  msgs.appendChild(digitando);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${CHAVE}`
      },
      body: JSON.stringify({
        model: 'llama3-8b-8192',
        messages: [
          { role: 'system', content: 'Você é um assistente de programação didático. Responda em português brasileiro de forma clara e simples.' },
          { role: 'user', content: texto }
        ]
      })
    });
    const data = await res.json();
    digitando.remove();
    const resposta = data.choices[0].message.content;
    msgs.innerHTML += `<div class="msg bot"><div class="avatar">IA</div><div class="balao">${resposta}</div></div>`;
  } catch(e) {
    digitando.remove();
    msgs.innerHTML += `<div class="msg bot"><div class="avatar">IA</div><div class="balao">Erro ao conectar. Tente novamente.</div></div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
</body>
</html>
